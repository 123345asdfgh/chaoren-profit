<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史记录 · 跨境日常辅助测算</title><link rel="stylesheet" href="history-static.css"></head><body><div class="static-wrap"><nav class="static-nav"><div class="brand">CHAOREN AI / CROSS-BORDER</div><div class="static-nav-links"><a class="active" href="history.html">历史记录</a><a href="calculator.html">跨境测算</a><a href="creator-sampling.html">达人寄样看板</a><a href="feishu.html">飞书连接</a></div></nav><header class="history-hero"><img class="hero-logo" src="legacy/assets/chaoren-logo.png" alt="CHAOREN AI"><div><div class="eyebrow">CHAOREN AI / 跨境经营工作台</div><h1>历史记录</h1><p>查看最近的测算结果、利润变化与订单修改记录。</p></div><div class="hero-art"><img src="legacy/assets/chaoren-mascot.png" alt="超韧 AI 吉祥物"></div></header><section class="time-strip"><div class="time-strip-lite"><div class="time-card"><span class="label">北京时间</span><strong id="cn-time">--:--:--</strong><small id="cn-date">加载中</small></div><div class="time-middle">中美时间<br><small>实时同步</small></div><div class="time-card"><span class="label">美国时间 · 洛杉矶</span><strong id="us-time">--:--:--</strong><small id="us-date">加载中</small></div></div></section><section class="filters"><label>商品名称 / 规格编码 / 商品编码<input id="history-query" type="search" placeholder="输入关键词搜索"></label><label>商品属性<select id="history-category"><option value="">全部属性</option><option>常规</option><option>盲盒</option><option>毛绒</option></select></label><label>操作人<input placeholder="静态演示" disabled></label><div class="filter-box"><span>数据模式</span><input value="免登录静态演示" disabled></div><div class="filter-box"><span>操作</span><button id="new-order" type="button">＋ 新增商品</button></div></section><section class="records-card"><div class="records-head"><h2>历史记录</h2><span id="history-count"></span></div><table class="records-table"><thead><tr><th>图片</th><th>商品名称</th><th>规格编码</th><th>商品编码</th><th>商品属性</th><th>净利润</th><th>利润率</th><th>最近保存</th><th>操作人</th><th>操作</th></tr></thead><tbody id="history-rows"></tbody></table></section><p class="demo-note">这是 GitHub Pages 静态演示版，不需要登录；真实保存、飞书读取、数据库和 Redis 仍在正式项目中运行。</p></div><script src="history-static.js"></script><script>(function(){function tick(){const n=new Date(),cn=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}),us=new Intl.DateTimeFormat('zh-CN',{timeZone:'America/Los_Angeles',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}),date=(z)=>new Intl.DateTimeFormat('zh-CN',{timeZone:z,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).format(n);document.getElementById('cn-time').textContent=cn.format(n);document.getElementById('us-time').textContent=us.format(n);document.getElementById('cn-date').textContent=date('Asia/Shanghai');document.getElementById('us-date').textContent=date('America/Los_Angeles')}tick();setInterval(tick,1000)})();</script></body></html>
